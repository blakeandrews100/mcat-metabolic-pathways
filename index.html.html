<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metabolism Pathway Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Schibsted+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, clinical study tool; precise, no decoration.
   IDEA: a biochemistry wall chart you fill in, like a textbook pathway figure turned into a worksheet.
   PICTURE: the pathway itself (chain or ring) is the working thing, right under a modest title.
   COLOUR and TYPE: white / near-black ground, cobalt accent; one hue per kind (molecule, enzyme, cofactor, reaction). Schibsted Grotesk titles, Atkinson Hyperlegible body.
   LAYOUT: header + section nav, pathway rail, one toolbar, then the chart; ring collapses to a mini-ring + list below 900px. */
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#0f1216);--surf:light-dark(#f4f6f8,#161a20);--surf2:light-dark(#eceff3,#1d222a);
  --ink:light-dark(#111418,#e9edf2);--muted:light-dark(#5b6471,#9aa4b2);--line:light-dark(#dfe3e8,#2a313a);
  --acc:light-dark(#2347d0,#8ea8ff);--acc-ink:light-dark(#ffffff,#0f1216);
  --mol:light-dark(#0b7a64,#4fd1b0);--enz:light-dark(#6b46d6,#b6a0ff);--cof:light-dark(#b45309,#f2b25c);--rxn:light-dark(#c0265e,#ff8fb4);
  --ok:light-dark(#157a3c,#63d38b);--bad:light-dark(#c2261b,#ff8577);--star:light-dark(#c2410c,#fb923c);
  --hl:light-dark(#f7c948,#a17c00);
  --head:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);overflow-x:clip}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(3vw,14px)}
header.top{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
.toprow{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:12px 0 0}
h1{font:700 22px/1.1 var(--head);margin:0;letter-spacing:-.01em}
h1 small{display:block;font:400 13px/1.3 var(--body);color:var(--muted);letter-spacing:0;margin-top:3px}
.seg.theme{margin-left:auto;flex-wrap:nowrap}
nav.sec{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
nav.sec::-webkit-scrollbar{display:none}
nav.sec a{flex:none;padding:10px 12px;color:var(--muted);text-decoration:none;font-weight:700;font-size:15px;border-bottom:2px solid transparent}
nav.sec a[aria-current=page]{color:var(--ink);border-color:var(--acc)}
main{padding:18px 0 64px;display:grid;gap:16px}
/* segmented + chips */
.seg{display:inline-flex;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:0 12px;min-height:36px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:700}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12),0 0 0 1px var(--line)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;font-weight:700;color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--k,var(--muted));flex:none}
.chip[aria-pressed=true]{color:var(--ink);border-color:var(--k,var(--acc));background:color-mix(in srgb,var(--k,var(--acc)) 12%,var(--bg))}
.k-mol{--k:var(--mol)}.k-enz{--k:var(--enz)}.k-cof{--k:var(--cof)}.k-rxn{--k:var(--rxn)}
.btn{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.grp{display:grid;gap:6px}
.lbl{font-size:13px;color:var(--muted);font-weight:700}
/* pathway rail */
.rail{display:flex;gap:18px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.rail .g{flex:none;display:grid;gap:6px}
.rail .g>span{font-size:12px;color:var(--muted);font-weight:700}
.rail .g>div{display:flex;gap:6px}
.rail button{flex:none;min-height:38px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;white-space:nowrap}
.rail button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.rail button .cy{opacity:.6;margin-left:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;padding:14px;background:var(--surf);border:1px solid var(--line);border-radius:14px}
.toolbar .grp{display:grid;gap:6px}
.toolbar .chips{display:flex;flex-wrap:wrap;gap:6px}
.toolbar .acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
/* chart */
.chart{border:1px solid var(--line);border-radius:16px;padding:18px clamp(14px,2.4vw,26px);display:grid;gap:14px}
.chead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.chead h2{font:700 clamp(24px,3vw,32px)/1.05 var(--head);margin:0;letter-spacing:-.015em;text-wrap:balance}
.tag{font-size:13px;color:var(--muted);padding:2px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.score{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.score.good{color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--k)}
.legend .st{color:var(--star);font-weight:700}
.slotw{display:flex;gap:6px;align-items:stretch}
.slotw>:first-child{flex:1}
.slot{display:flex;align-items:center;width:100%;min-height:44px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);border-left:4px solid var(--k);background:var(--bg);font-size:16px;line-height:1.25}
.slot.show{background:color-mix(in srgb,var(--k) 9%,var(--bg));border-color:color-mix(in srgb,var(--k) 28%,var(--line));border-left-color:var(--k)}
.slot.mol.show{font-weight:700}
.slot.enz.show{color:color-mix(in srgb,var(--enz) 70%,var(--ink))}
.slot.cof,.slot.rxn{font-size:15px}
.slot .ab{color:var(--muted);font-weight:400;margin-left:6px;font-size:14px}
select.slot{display:block;-webkit-appearance:none;appearance:none;cursor:pointer;padding:0 34px 0 12px;height:44px;line-height:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input.slot::placeholder{color:var(--muted);opacity:.8}
select.slot:invalid,select.slot.empty{color:var(--muted)}
.slot.ok{border-color:var(--ok);border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--bg))}
.slot.bad{border-color:var(--bad);border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--bg))}
.slot.rev{border-style:dashed}
.fix{font-size:13px;color:var(--bad);margin-top:3px;font-weight:700}
.mbtn{flex:none;width:42px;height:42px;align-self:flex-start;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--mol)}
.mbtn svg{width:22px;height:22px}
.mbtn:hover{background:color-mix(in srgb,var(--mol) 10%,var(--bg))}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surf2);color:var(--muted);font-size:12px;font-weight:700;display:grid;place-items:center;align-self:center}
/* linear */
.lin{display:grid;max-width:760px}
.lin .node{display:flex;gap:8px;align-items:center;max-width:430px}
.lin .step{display:grid;grid-template-columns:34px minmax(0,1fr);margin-left:0}
.lin .arr{position:relative}
.lin .arr::before{content:"";position:absolute;left:12px;top:4px;bottom:10px;width:2px;background:var(--line)}
.lin .arr::after{content:"";position:absolute;left:7px;bottom:2px;border:6px solid transparent;border-top:9px solid var(--muted)}
.lin .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:6px;padding:10px 0 14px;max-width:700px}
.star{color:var(--star);font-weight:700;font-size:13px;align-self:center}
.back{color:var(--muted);font-weight:700;padding:6px 0 0 34px}
/* ring */
.cyc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.ring{position:relative}
.ring>svg{position:absolute;inset:0;width:100%;height:100%}
.ring .n{position:absolute;width:212px;transform:translate(-50%,-50%);display:flex;gap:6px;align-items:flex-start}
.ring .n .num{margin-top:9px}
.ring .n>.slotw{flex:1}
.ring .n .ab{display:none}
.ring .n .slot.mol.show{font-size:15px}
.cyc>.ring{position:sticky;top:120px}
.ring .center{position:absolute;transform:translate(-50%,-50%);width:220px;text-align:center;color:var(--muted);font-size:14px;line-height:1.4}
.ring .center b{display:block;font:700 20px/1.1 var(--head);color:var(--ink);margin-bottom:4px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.steps .sh2{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:700}
.stepb{width:24px;height:24px;border-radius:50%;background:var(--surf2);display:grid;place-items:center;font-size:12px}
.steps .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:6px}
.mini{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mini svg{width:150px;height:150px;flex:none}
.mini p{margin:0;color:var(--muted);font-size:14px;max-width:40ch}
details.facts{border-top:1px solid var(--line);padding-top:10px}
details.facts summary{cursor:pointer;font-weight:700;min-height:32px}
details.facts ul{margin:6px 0 0;padding-left:1.2em;display:grid;gap:4px;max-width:80ch}
/* sheet */
dialog.sheet{border:0;padding:0;background:var(--bg);color:var(--ink);width:min(440px,100vw);max-width:100vw;height:100dvh;max-height:100dvh;margin:0 0 0 auto;box-shadow:-10px 0 40px rgb(0 0 0/.25)}
dialog.sheet::backdrop{background:rgb(10 14 20/.35)}
.sh{display:grid;gap:14px;padding:18px 20px 28px}
.sh .shh{display:flex;gap:10px;align-items:flex-start}
.sh h3{font:700 24px/1.1 var(--head);margin:0;flex:1;text-wrap:balance}
.sh h3 small{display:block;font:400 13px/1.3 var(--body);color:var(--muted);margin-top:4px}
.molbox{background:var(--surf);border:1px solid var(--line);border-radius:12px;min-height:260px;display:grid;place-items:center;padding:8px}
.molbox svg{width:100%;height:auto;max-height:340px}
.sh .how{display:grid;gap:6px;font-size:15px}
.sh .how b{font-weight:700}
.sh .fine{font-size:13px;color:var(--muted)}
.hlkey{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--hl);vertical-align:-1px;margin-right:4px}
/* regulation */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.rc{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start}
.rc h3{font:700 18px/1.15 var(--head);margin:0}
.rc .pw{font-size:13px;color:var(--muted)}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.rchip b{width:18px;text-align:center;font-weight:700}
.rchip[data-s=a]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--bg))}
.rchip[data-s=i]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--bg))}
.rchip[data-s=n]{border-style:dashed;color:var(--muted)}
.rchip.wrong{outline:2px solid var(--bad);outline-offset:1px}
.rchip.right{outline:2px solid var(--ok);outline-offset:1px}
.rc .note{font-size:14px;color:var(--muted)}
.help{color:var(--muted);font-size:15px;margin:0;max-width:75ch}
/* fed/fasted */
.ff{display:grid;gap:8px}
.ffr{display:grid;grid-template-columns:minmax(0,1.3fr) auto auto;gap:8px 16px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.ffr .nm{font-weight:700}
.ffr .o{grid-column:1/-1;font-size:14px;color:var(--muted)}
.ffr .seg button{min-width:44px}
.ffr .seg.ok{border-color:var(--ok)}.ffr .seg.bad{border-color:var(--bad)}
.ffh{display:grid;grid-template-columns:minmax(0,1.3fr) auto auto;gap:16px;padding:0 12px;font-size:13px;color:var(--muted);font-weight:700}
.ffh span:not(:first-child){width:104px;text-align:center}
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px;margin-top:10px}
.cheat div{background:var(--surf);border-radius:12px;padding:12px 14px;font-size:14px}
.cheat b{display:block;font:700 16px var(--head);margin-bottom:4px}
/* what-if */
.wq{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.wq h3{font:700 18px/1.3 var(--body);margin:0}
.wq .opts{display:grid;gap:6px}
.wq .opts button{text-align:left;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:15px}
.wq .opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--bg));font-weight:700}
.wq .opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--bg))}
.wq .opts button:disabled{cursor:default;color:inherit}
.wq .ex{font-size:15px;background:var(--surf);border-radius:10px;padding:10px 12px}
/* ATP */
.atp{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;align-items:start}
.big{border-radius:16px;background:var(--acc);color:var(--acc-ink);padding:18px;display:grid;gap:4px}
.big b{font:700 clamp(44px,6vw,64px)/1 var(--head);font-variant-numeric:tabular-nums}
.big span{font-size:14px;opacity:.85}
table.t{width:100%;border-collapse:collapse;font-size:15px}
.t th,.t td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t th:first-child,.t td:first-child{text-align:left;white-space:normal}
.t th{font-size:13px;color:var(--muted);font-weight:700}
.t tr.tot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.t input{width:68px;min-height:38px;text-align:right;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;font-size:16px}
.t input.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--bg))}
.t input.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--bg))}
.atpc{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.atpc input[type=number]{width:80px;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg);font-size:16px}
.notes{font-size:14px;color:var(--muted);display:grid;gap:4px;margin:0;padding-left:1.1em}
/* progress */
.prow{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 170px auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.bar{height:10px;border-radius:99px;background:var(--surf2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.prow .v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;text-align:right}
.miss{display:grid;gap:6px}
.miss div{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-left:4px solid var(--k);border-radius:10px;font-size:15px}
.miss div span{color:var(--muted);font-size:13px}
.miss div em{margin-left:auto;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:12px 0}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.card h2{font:700 22px/1.1 var(--head);margin:0}
.sechead h2{font:700 clamp(26px,3.4vw,34px)/1.05 var(--head);margin:0 0 6px;letter-spacing:-.015em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media(max-width:700px){
  .toprow{padding-top:10px;gap:10px}h1{font-size:18px}.seg.theme button{min-height:30px;padding:0 8px;font-size:12px}
  nav.sec a{padding:9px 10px;font-size:14px}
  main{padding-top:12px;gap:12px}
  .rail{gap:12px}.rail button{min-height:36px;padding:0 11px}
  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;padding:12px}
  .toolbar>.grp:nth-child(n+3){grid-column:1/-1}
  .toolbar .seg{display:flex;flex-wrap:nowrap}.toolbar .seg button{flex:1;padding:0 6px;font-size:13px}
  .toolbar .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
  .toolbar .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;min-height:34px;padding:0 11px;font-size:13px}
  .toolbar .acts{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;padding:10px 14px 12px;gap:8px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .toolbar .acts .btn{flex:1;min-height:44px}
  main:has(.toolbar .acts){padding-bottom:96px}
  .chart{padding:14px;border-radius:14px;gap:12px}
  .chead h2{font-size:24px}.legend{font-size:12px;gap:4px 12px}.legend .tip{display:none}.long{display:none}
  .lin .step{grid-template-columns:22px minmax(0,1fr)}.lin .arr::before{left:9px}.lin .arr::after{left:4px}
  .lin .fields{padding:8px 0 12px}.back{padding-left:22px}

  header.top{position:static}.toolbar{gap:10px 14px;padding:12px}.theme button{min-height:30px;padding:0 9px;font-size:13px}.toprow{flex-wrap:nowrap}h1{font-size:19px}
  .toolbar .acts{margin-left:0;width:100%}.toolbar .acts .btn{flex:1}
  .atp{grid-template-columns:1fr}.big{order:-1}
  .ffr{grid-template-columns:1fr 1fr}.ffr .nm{grid-column:1/-1}.ffh{display:none}
  .ffr .seg::before{content:attr(data-l);font-size:12px;color:var(--muted);font-weight:700;align-self:center;padding:0 6px}
  .prow{grid-template-columns:minmax(0,1fr) 90px;}.prow .bar{grid-column:1/-1;order:3}
  .t{font-size:14px}.t th,.t td{padding:8px 4px}.t input{width:56px}
  h1 small{display:none}
}
@media(max-width:600px){dialog.sheet{width:100vw;height:88dvh;margin:auto 0 0;border-radius:16px 16px 0 0}}
@media(prefers-reduced-motion:no-preference){dialog.sheet[open]{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.4}}}

</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="toprow"><h1>Metabolism pathway trainer<small>Fill in MCAT pathways · structures · regulation · yields</small></h1><div class="seg theme" id="theme" aria-label="Theme"></div></div>
  <nav class="sec" id="secnav" aria-label="Sections"></nav>
</div></header>
<main class="wrap" id="view"></main>
<dialog class="sheet" id="sheet" aria-label="Molecule structure"></dialog>
<script src="https://cdn.jsdelivr.net/npm/smiles-drawer@2.4.1/dist/smiles-drawer.min.js"></script>
<script>
// ---------- Structures (drawn neutral; stereo omitted). [Xe] = R group, [Kr] = CoA. Atom class :1 = highlighted change ----------
const P_ = "P(=O)(O)O";

/* ---------- progress ---------- */
function renderProg(){
  const rows=P.map(p=>{const s=PR.paths[p.id];return `<div class="prow"><span><b>${esc(p.name)}</b></span><div class="bar"><i style="width:${s?s.best:0}%"></i></div><span class="v">${s?`best ${s.best}% · last ${s.last}%`:"not tried"}</span><button class="btn ghost" data-act="go" data-id="${p.id}">Practice</button></div>`;}).join("");
  const miss=Object.values(PR.miss).sort((a,b)=>(a.last-b.last)||(b.c-a.c)).slice(0,14);
  const other=[["Regulation",PR.reg],["Fed vs fasted",PR.ff],["What if…",PR.wi]].map(([n,v])=>`<div class="prow"><span><b>${n}</b></span><div class="bar"><i style="width:${v?v.best:0}%"></i></div><span class="v">${v?`best ${v.best}% · last ${v.last}%`:"not tried"}</span><span></span></div>`).join("");
  $("#view").innerHTML=`<div class="sechead"><h2>Progress</h2><p class="help">Saved in this browser only. Scores update each time you press Check (What if… updates when you finish all questions).</p></div>
  <section class="card"><h2>Pathways</h2><div>${rows}</div></section>
  <section class="card"><h2>Most-missed blanks</h2><div class="miss">${miss.length?miss.map(m=>{const p=P.find(x=>x.id===m.p);return `<div class="k-${m.k}"><b>${esc(m.a)}</b><span>${esc(p?p.name:"")} · ${esc(KIND[m.k])}</span><em>${m.last?"✓ fixed":"missed ×"+m.c}</em></div>`;}).join(""):'<p class="empty">Nothing yet. Misses show up here after you press Check on a pathway.</p>'}</div></section>
  <section class="card"><h2>Other sections</h2><div>${other}</div></section>
  <div class="row"><button class="btn ghost" data-act="progreset" id="pr">Reset all progress</button></div>`;
}

/* ---------- shell ---------- */
function render(){
  const pl=$('nav.sec a[data-s="path"]'); if(pl) pl.href="#"+S.tab;
  $$("nav.sec a").forEach(a=>a.setAttribute("aria-current",a.dataset.s===sec?"page":"false"));
  $$("#theme button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.theme));
  ({path:renderPath,regulation:renderReg,"fed-fasted":renderFF,"what-if":renderWI,atp:renderATP,progress:renderProg})[sec]();
  saveS();
}
function route(){const h=location.hash.slice(1);
  if(P.some(p=>p.id===h)){sec="path";S.tab=h;} else if(SECS.some(s=>s[0]===h&&h!=="path")) sec=h; else sec="path";
  render();}
function go(h){if(location.hash.slice(1)===h) route(); else location.hash=h;}

$("#secnav").innerHTML=SECS.map(([id,n])=>`<a href="#${id==="path"?S.tab:id}" data-s="${id}">${n}</a>`).join("");
$("#theme").innerHTML=[["auto","Auto"],["light","Light"],["dark","Dark"]].map(([v,l])=>`<button data-act="theme" data-v="${v}">${l}</button>`).join("");

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) {if(e.target.id==="sheet") $("#sheet").close(); return;}
  const act=b.dataset.act,v=b.dataset.v;
  switch(act){
    case "tab": go(b.dataset.id); break;
    case "go": go(b.dataset.id); break;
    case "view": S.view=v; render(); break;
    case "diff": if(S.diff!==v){S.diff=v;resetAnswers();} render(); break;
    case "show": {const k=b.dataset.k; if(S.random){S.random=false;S.show=[];} S.show=S.show.includes(k)?S.show.filter(x=>x!==k):[...S.show,k]; resetAnswers(); render(); break;}
    case "random": S.random=!S.random; if(S.random) S.seed=Math.floor(Math.random()*1e6); resetAnswers(); render(); break;
    case "reshuffle": S.seed=Math.floor(Math.random()*1e6); resetAnswers(); render(); break;
    case "inc": {const k=b.dataset.k; S.inc=S.inc.includes(k)?S.inc.filter(x=>x!==k):[...S.inc,k]; resetAnswers(); render(); break;}
    case "preset": S.random=false; S.show=v==="all"?["mol",...S.inc]:[]; resetAnswers(); render(); break;
    case "clear": delete A[S.tab]; delete RES[S.tab]; render(); break;
    case "check": checkPath(); break;
    case "reveal": revealPath(); break;
    case "theme": S.theme=v; applyTheme(); render(); if($("#sheet").open&&sheetI!=null) openSheet(sheetI); break;
    case "mol": openSheet(+b.dataset.i); break;
    case "molname": openSheet(sheetI,true); break;
    case "molstep": {const n=curP().nodes.length; openSheet((sheetI+ +b.dataset.d+n)%n); break;}
    case "close": $("#sheet").close(); break;
    case "regchip": {const k=b.dataset.k,o=["","a","i","n"];REGA[k]=o[(o.indexOf(REGA[k]||"")+1)%4];REGC=false;renderReg();break;}
    case "regcheck": {REGC=true;let ok=0,t=0;REG.forEach((r,i)=>regChips(r,i).forEach(c=>{t++;if((REGA[r.e+"|"+c]||"")===regTruth(r,c))ok++;}));const pct=Math.round(100*ok/t);PR.reg={best:Math.max(PR.reg?PR.reg.best:0,pct),last:pct};saveP();renderReg();break;}
    case "regreveal": REG.forEach((r,i)=>regChips(r,i).forEach(c=>REGA[r.e+"|"+c]=regTruth(r,c)));REGC=true;renderReg();break;
    case "regclear": REGA={};REGC=false;renderReg();break;
    case "regshuffle": S.seed=Math.floor(Math.random()*1e6);REGC=false;renderReg();saveS();break;
    case "ff": FFA[b.dataset.k]=+v;FFC=false;renderFF();break;
    case "ffcheck": {FFC=true;let ok=0;FED.forEach((f,i)=>{if(FFA[i+"f"]===f.fed)ok++;if(FFA[i+"s"]===f.fast)ok++;});const pct=Math.round(50*ok/FED.length);PR.ff={best:Math.max(PR.ff?PR.ff.best:0,pct),last:pct};saveP();renderFF();break;}
    case "ffreveal": FED.forEach((f,i)=>{FFA[i+"f"]=f.fed;FFA[i+"s"]=f.fast;});FFC=true;renderFF();break;
    case "ffclear": FFA={};FFC=false;renderFF();break;
    case "wi": {WIA[b.dataset.q]=+b.dataset.o; if(Object.keys(WIA).length===WHATIF.length){const ok=Object.entries(WIA).filter(([i,x])=>WHATIF[i].a===x).length,pct=Math.round(100*ok/WHATIF.length);PR.wi={best:Math.max(PR.wi?PR.wi.best:0,pct),last:pct};saveP();}
      const y=b.closest(".wq").getBoundingClientRect().top; renderWI(); const q=$$(".wq")[b.dataset.q]; if(q) window.scrollBy(0,q.getBoundingClientRect().top-y); break;}
    case "wireset": WIA={};renderWI();break;
    case "atp": {const k=b.dataset.k;S[k]=k==="atpq"?v==="1":v;ATPA={};ATPC=false;render();break;}
    case "atpcheck": ATPC=true;renderATP();break;
    case "atpreveal": {const {out,tot}=atpCalc();out.forEach((r,i)=>["nadh","fadh","dir","eq"].forEach(c=>ATPA[i+c]=r[c]));["nadh","fadh","dir","eq"].forEach(c=>ATPA["t"+c]=tot[c]);ATPC=true;renderATP();break;}
    case "atpclear": ATPA={};ATPC=false;renderATP();break;
    case "progreset": if(b.dataset.armed){PR={paths:{},miss:{},reg:null,ff:null,wi:null};saveP();renderProg();} else {b.dataset.armed=1;b.textContent="Tap again to erase everything";b.classList.remove("ghost");} break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.matches(".slot[data-key]")){const a=A[S.tab]=A[S.tab]||{};a[t.dataset.key]=t.value;const r=RES[S.tab];if(r){delete r[t.dataset.key];}
    t.classList.remove("ok","bad","rev");t.classList.toggle("empty",!t.value);const fx=t.parentElement.querySelector(".fix");if(fx)fx.remove();}
  if(t.dataset.atp!==undefined){ATPA[t.dataset.atp]=t.value;t.classList.remove("ok","bad");}
});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.act==="fa"){let n=Math.round(+t.value/2)*2;n=Math.min(24,Math.max(4,n||16));S.fa=n;ATPA={};ATPC=false;renderATP();saveS();}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input.slot")){const ins=$$("input.slot");const i=ins.indexOf(e.target);if(ins[i+1])ins[i+1].focus();else checkPath();}});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(S.theme==="auto"&&$("#sheet").open&&sheetI!=null) openSheet(sheetI);});
let rt;const ro=new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{if(sec==="path"&&S.view==="cycle"&&curP().cyc&&wideOK(curP())!==ringWide) renderPath();},120);});ro.observe(document.body);
addEventListener("hashchange",route);
applyTheme(); route();
}

</script>
</body>
</html>
